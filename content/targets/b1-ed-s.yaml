fiches:
  finale-absente:
    fr: "La terminaison de « {word} » ne s'entend pas : on risque de comprendre une autre forme grammaticale. [Terminez|Termine] nettement sur /{ending}/."
    en: "The ending of '{word}' can't be heard: the listener may hear a different grammatical form. Finish clearly on /{ending}/."
  ed-en-trop:
    fr: "« {word} » a été prononcé avec une syllabe de trop (-ED). Après ce son, -ed se dit simplement /{ending}/, collé au verbe."
    en: "'{word}' was said with an extra syllable (-ED). After this sound, -ed is simply /{ending}/, attached to the verb."
