id: a2-stress2
level: A2
order: 2
domain: prosodie
kind: stress
planet: {color: coral, motif: rings}
title: {fr: "La syllabe forte", en: "The strong syllable"}
tagline: {fr: "Mots de deux syllabes : DA-da ou da-DA ?", en: "Two-syllable words: DA-da or da-DA?"}
why:
  fr: "L'accent de mot est le premier facteur de compréhension de votre anglais : un mot mal accentué peut devenir méconnaissable. Le français accentue la fin des groupes ; l'anglais choisit une syllabe par mot, et elle ne bouge pas."
  en: "Word stress is the number-one factor in being understood: a wrongly stressed word can become unrecognisable. French stresses the end of phrases; English picks one syllable per word, and it doesn't move."
criterion:
  fr: "Je repère la syllabe forte à l'oreille et je la rends plus longue, plus claire et plus mélodique que l'autre."
  en: "I can hear the strong syllable and I make it longer, clearer and more melodic than the other."
phones: []
errors:
  - {target: stress, realized: final, fiche: accent-final, weight: 1.0}
  - {target: stress, realized: flat, fiche: accent-plat, weight: 0.8}
lesson:
  - type: text
    fr: "Dans un mot anglais, une syllabe « gagne » : elle est plus longue, plus claire, et la voix y change de hauteur. Les autres rapetissent. C'est ce relief que l'oreille de votre interlocuteur utilise pour reconnaître le mot."
    en: "In an English word, one syllable 'wins': it's longer, clearer, and the voice changes pitch on it. The others shrink. Your listener uses this shape to recognise the word."
  - type: contrast
    fr: "En français, l'accent tombe sur la fin : « un pro-blème ». En anglais : PRO-blem."
    en: "In French, stress falls at the end: 'un pro-blème'. In English: PRO-blem."
    french: "un problème"
    english: "a problem"
  - type: text
    fr: "Bonne nouvelle : ce n'est pas un manque d'oreille. Le français n'utilise pas l'accent pour distinguer les mots, alors notre cerveau a appris à l'ignorer. Ça se rééduque, avec de l'entraînement régulier."
    en: "Good news: it's not a lack of ear. French doesn't use stress to tell words apart, so our brains learned to ignore it. It can be retrained with regular practice."
  - type: rule
    fr: "Règle de base : la plupart des noms et adjectifs de deux syllabes sont accentués sur la 1re (TA-ble, HAP-py). Beaucoup de verbes, et les mots qui commencent par un préfixe comme be-, for-, de-, re-, a-, sont accentués sur la 2e (be-GIN, for-GET, de-CIDE)."
    en: "Basic rule: most two-syllable nouns and adjectives are stressed on the 1st syllable (TA-ble, HAP-py). Many verbs, and words starting with a prefix like be-, for-, de-, re-, a-, are stressed on the 2nd (be-GIN, for-GET, de-CIDE)."
  - type: gesture
    art: bubbles
    fr: "[Frappez|Frappe] dans vos mains sur la syllabe forte, [effleurez|effleure] sur la faible : CLAP-tap pour « happy », tap-CLAP pour « hotel »."
    en: "Clap on the strong syllable, tap lightly on the weak one: CLAP-tap for 'happy', tap-CLAP for 'hotel'."
  - type: quiz
    q: {fr: "« career » (carrière) se prononce…", en: "'career' is pronounced…"}
    options: ["CA-reer", "ca-REER"]
    answer: 1
    explain: {fr: "ca-REER. Attention : CA-reer ressemble à « Korea » !", en: "ca-REER. Careful: CA-reer sounds like 'Korea'!"}
