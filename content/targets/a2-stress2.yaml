guided:
  - text: "I want a career in marketing."
    fr: "ca-REER (pas « Korea ») et MAR-ke-ting."
    en: "ca-REER (not 'Korea') and MAR-ke-ting."
  - text: "The event begins today."
    fr: "Trois mots accentués sur la 2e syllabe : e-VENT, be-GINS, to-DAY."
    en: "Three words stressed on the 2nd syllable: e-VENT, be-GINS, to-DAY."
  - text: "Don't forget the concept!"
    fr: "for-GET, CON-cept."
    en: "for-GET, CON-cept."
transfer:
  - fr: "Décrivez votre lieu de vacances idéal en quelques phrases. Essayez de placer : hotel, garden, water, relax, enjoy."
    en: "Describe your ideal holiday spot in a few sentences. Try to use: hotel, garden, water, relax, enjoy."
    hint_words: [hotel, garden, water, relax, enjoy]
fiches:
  accent-final:
    fr: "La syllabe la plus forte était la dernière, comme en français. [Allongez|Allonge] et [faites|fais] monter la voix sur la syllabe {stressed}, puis [laissez|laisse] retomber la suivante."
    en: "The strongest syllable was the last one, as in French. Lengthen the syllable {stressed} and raise your voice on it, then let the next one drop."
  accent-plat:
    fr: "Les deux syllabes ont presque le même poids. [Exagérez|Exagère] d'abord : une syllabe géante, une toute petite. On revient au naturel ensuite."
    en: "Both syllables have almost the same weight. Exaggerate first: one giant syllable, one tiny one. Then go back to natural."
