    en: "Briefly present your field of study or your job using at least three words with strong suffixes (-ic, -ion, -ity, -ical, -ian)."
    hint_words: [education, economic, university, scientific, technician]
fiches:
  suffixe-fort:
    fr: "Dans « {word} », le suffixe impose sa règle : l'accent tombe sur « {stressed} ». [Dérivez|Dérive] à voix haute depuis le mot de base pour sentir le déplacement."
    en: "In '{word}', the suffix sets the rule: stress falls on '{stressed}'. Derive it aloud from the base word to feel the shift."
