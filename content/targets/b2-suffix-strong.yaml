    fr: "de-MO-cra-cy puis de-mo-CRA-tic : l'accent saute d'une syllabe."
    en: "de-MO-cra-cy then de-mo-CRA-tic: the stress jumps one syllable."
  - text: "The politician talked about politics."
    fr: "po-li-TI-cian (-ian) mais PO-li-tics."
    en: "po-li-TI-cian (-ian) but PO-li-tics."
transfer:
