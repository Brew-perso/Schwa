id: b2-suffix-strong
level: B2
order: 1
domain: prosodie
kind: stress
planet: {color: coral, motif: rings}
title: {fr: "Les suffixes forts", en: "Strong suffixes"}
tagline: {fr: "PHO-to-graph → pho-TO-gra-phy → pho-to-GRA-phic", en: "PHO-to-graph → pho-TO-gra-phy → pho-to-GRA-phic"}
why:
  fr: "Certains suffixes « tirent » l'accent vers eux : il tombe alors sur la syllabe qui les précède, ou une syllabe avant. Maîtriser ces suffixes, c'est accentuer correctement des milliers de mots savants — ceux-là mêmes que les jurys épinglent (e-CO-no-mics au lieu de e-co-NO-mics)."
  en: "Some suffixes 'pull' stress towards them: it then falls on the syllable before them, or one syllable earlier. Mastering these suffixes means correctly stressing thousands of academic words — the very ones examiners pick up on (e-CO-no-mics instead of e-co-NO-mics)."
criterion:
  fr: "Je sais où tombe l'accent dans les mots en -ic, -ion, -ity, -ial, -ian, -ical, -graphy, et je le déplace quand je dérive un mot."
  en: "I know where stress falls in words ending in -ic, -ion, -ity, -ial, -ian, -ical, -graphy, and I shift it when I derive a word."
phones: []
errors:
  - {target: stress, realized: other, fiche: suffixe-fort, weight: 1.0}
  - {target: stress, realized: final, fiche: suffixe-fort, weight: 1.0}
lesson:
  - type: text
    fr: "Suffixes qui placent l'accent juste avant eux (schéma « -10 ») : -ic (e-co-NO-mic), -ion (e-du-CA-tion), -ial (es-SEN-tial), -ian (mu-SI-cian), -ious (de-LI-cious), -ient (ef-FI-cient). L'accent tombe sur la syllabe qui précède le suffixe."
    en: "Suffixes that put stress right before them ('-10' pattern): -ic (e-co-NO-mic), -ion (e-du-CA-tion), -ial (es-SEN-tial), -ian (mu-SI-cian), -ious (de-LI-cious), -ient (ef-FI-cient). Stress falls on the syllable before the suffix."
  - type: listen
    fr: "Une même famille, trois accents différents :"
    en: "One word family, three different stress patterns:"
    items: [photograph, photography, photographic]
  - type: rule
    fr: "Suffixes qui placent l'accent deux syllabes avant la fin (schéma « -100 ») : -ity (e-lec-TRI-ci-ty), -ical (po-LI-ti-cal), -graphy, -logy (bi-O-lo-gy), -ate dans les mots de 3 syllabes et plus (com-MU-ni-cate)."
    en: "Suffixes that put stress two syllables before the end ('-100' pattern): -ity (e-lec-TRI-ci-ty), -ical (po-LI-ti-cal), -graphy, -logy (bi-O-lo-gy), -ate in words of 3+ syllables (com-MU-ni-cate)."
  - type: text
    fr: "Quand l'accent se déplace, les voyelles changent avec lui : PHO-to-graph /ˈfəʊtəɡrɑːf/ mais pho-TO-gra-phy /fəˈtɒɡrəfi/. La voyelle accentuée devient pleine, les autres se réduisent."
    en: "When stress moves, vowels change with it: PHO-to-graph /ˈfəʊtəɡrɑːf/ but pho-TO-gra-phy /fəˈtɒɡrəfi/. The stressed vowel becomes full, the others reduce."
  - type: quiz
    q: {fr: "Où est l'accent dans « economic » ?", en: "Where is the stress in 'economic'?"}
    options: ["E-co-no-mic", "e-CO-no-mic", "e-co-NO-mic"]
    answer: 2
    explain: {fr: "-ic place l'accent juste avant : e-co-NO-mic. Comparez : e-CO-no-my.", en: "-ic puts stress right before it: e-co-NO-mic. Compare: e-CO-no-my."}
