guided:
  - text: "It's a great opportunity to develop the museum."
    fr: "op-por-TU-ni-ty, de-VE-lop, mu-SE-um."
    en: "op-por-TU-ni-ty, de-VE-lop, mu-SE-um."
  - text: "Can you be more specific about the character?"
    fr: "spe-CI-fic, CHA-rac-ter : deux mots souvent mal accentués."
    en: "spe-CI-fic, CHA-rac-ter: two words often mis-stressed."
transfer:
  - fr: "Décrivez un musée, un film ou un livre qui vous a marqué. Essayez d'utiliser : museum, character, interesting, photograph, development."
    en: "Describe a museum, film or book that made an impression on you. Try to use: museum, character, interesting, photograph, development."
    hint_words: [museum, character, interesting, photograph, development]
fiches:
  accent-final-long:
    fr: "La syllabe forte est partie vers la fin du mot, comme en français. Dans « {word} », c'est « {stressed} » qui porte l'accent. [Commencez|Commence] par taper le rythme, puis [dites|dis] le mot sur ce rythme."
    en: "The strong syllable drifted to the end of the word, as in French. In '{word}', '{stressed}' carries the stress. Start by tapping the rhythm, then say the word to that rhythm."
  accent-deplace:
    fr: "L'outil perçoit l'accent sur « {heard} » plutôt que sur « {stressed} ». [Écoutez|Écoute] le modèle ralenti en regardant les bulles, puis [réessayez|réessaie]."
    en: "The tool hears the stress on '{heard}' rather than '{stressed}'. Listen to the slowed-down model while watching the bubbles, then try again."
