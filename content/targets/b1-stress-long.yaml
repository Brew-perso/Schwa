id: b1-stress-long
level: B1
order: 1
domain: prosodie
kind: stress
planet: {color: coral, motif: rings}
title: {fr: "L'accent des mots longs", en: "Stress in longer words"}
tagline: {fr: "PHO-to-graph, ba-NA-na, e-CO-no-my", en: "PHO-to-graph, ba-NA-na, e-CO-no-my"}
why:
  fr: "Les jurys et les enseignants le répètent : un accent déplacé sur un mot long (eCOnomics, cirCUMstances) le rend « à la limite du compréhensible », et entraîne presque toujours des erreurs de voyelles."
  en: "Examiners and teachers say it again and again: misplaced stress on a long word (eCOnomics, cirCUMstances) makes it 'barely understandable', and almost always drags vowel errors with it."
criterion:
  fr: "Dans les mots de trois et quatre syllabes, je place la syllabe forte au bon endroit, et je réduis les autres."
  en: "In three- and four-syllable words, I put the strong syllable in the right place, and I reduce the others."
phones: []
errors:
  - {target: stress, realized: final, fiche: accent-final-long, weight: 1.0}
  - {target: stress, realized: other, fiche: accent-deplace, weight: 1.0}
lesson:
  - type: text
    fr: "Pour les mots longs, la tradition des phonéticiens français propose une règle de base simple : sans suffixe particulier, l'accent remonte vers le début du mot. Pour les mots de trois syllabes ou plus, on part souvent de la fin et on compte trois syllabes : c'est le schéma « -100 » (PHO-to-graph, CI-ne-ma, CHA-rac-ter)."
    en: "For longer words, the French phonetics tradition offers a simple basic rule: with no special suffix, stress moves towards the start of the word. For words of three or more syllables, we often count three syllables back from the end: the '-100' pattern (PHO-to-graph, CI-ne-ma, CHA-rac-ter)."
  - type: listen
    fr: "Écoutez le relief :"
    en: "Listen to the shape:"
    items: [photograph, character, cinema, democracy]
  - type: rule
    fr: "Ce n'est qu'une règle de base, avec des exceptions fréquentes (ba-NA-na, to-MOR-row). La vraie habitude à prendre : toujours vérifier où tombe l'accent quand on apprend un mot, comme on vérifie son orthographe."
    en: "This is only a baseline, with frequent exceptions (ba-NA-na, to-MOR-row). The real habit to build: always check where the stress falls when you learn a word, just as you check its spelling."
  - type: gesture
    art: bubbles
    fr: "[Imaginez|Imagine] une grosse bulle pour la syllabe forte et de petits points gris pour les autres. [Exagérez|Exagère] d'abord la grosse bulle, puis [revenez|reviens] au naturel."
    en: "Picture one big bubble for the strong syllable and tiny grey dots for the others. Exaggerate the big bubble first, then go back to natural."
  - type: quiz
    q: {fr: "Où est l'accent dans « development » ?", en: "Where is the stress in 'development'?"}
    options: ["DE-ve-lop-ment", "de-VE-lop-ment", "de-ve-LOP-ment"]
    answer: 1
    explain: {fr: "de-VE-lop-ment : « -ment » est un suffixe neutre, l'accent reste celui de « de-VE-lop ».", en: "de-VE-lop-ment: '-ment' is a neutral suffix, so stress stays where it is in 'de-VE-lop'."}
