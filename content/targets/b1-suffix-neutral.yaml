fiches:
  suffixe-neutre:
    fr: "« {word} » garde l'accent de son mot de base : c'est « {stressed} » qui est fort. Le suffixe reste petit et réduit."
    en: "'{word}' keeps the stress of its base word: '{stressed}' is the strong one. The suffix stays small and reduced."
