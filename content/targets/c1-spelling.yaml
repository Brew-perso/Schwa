transfer:
  - fr: "[Présentez|Présente] en une minute un sujet de [votre|ton] domaine en utilisant au moins cinq mots transparents (image, focus, area, category, technique…)."
    en: "Present a topic from your field in one minute using at least five cognates (image, focus, area, category, technique…)."
    hint_words: [image, focus, area, category, technique, purpose]
fiches:
  mot-transparent:
    fr: "« {word} » a été lu à la française. En anglais, l'accent tombe sur « {stressed} », et les autres syllabes se réduisent."
    en: "'{word}' was read the French way. In English, stress falls on '{stressed}', and the other syllables reduce."
