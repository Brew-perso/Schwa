id: c1-spelling
level: C1
order: 4
domain: articuler
kind: spelling
planet: {color: mustard, motif: swirl}
title: {fr: "Graphie-phonie : les mots transparents", en: "Spelling to sound: deceptive cognates"}
tagline: {fr: "dessert / desert, focus, image, colleague…", en: "dessert / desert, focus, image, colleague…"}
why:
  fr: "Les mots qui ressemblent au français sont les plus traîtres : on les lit « à la française » (i-MAGE, fo-CUS, co-LLÈGUE). Leur accent et leurs voyelles sont souvent très différents. Ce sont précisément ceux qui apparaissent dans les présentations, les colles et les oraux."
  en: "Words that look French are the most treacherous: we read them 'the French way' (i-MAGE, fo-CUS, co-LLÈGUE). Their stress and vowels are often very different. These are exactly the words that come up in presentations and oral exams."
criterion:
  fr: "Je prononce les mots transparents avec l'accent et les voyelles de l'anglais, et je sais prédire la prononciation d'un mot nouveau."
  en: "I pronounce cognates with English stress and vowels, and I can predict how a new word is pronounced."
phones: []
errors:
  - {target: stress, realized: other, fiche: mot-transparent, weight: 0.9}
  - {target: stress, realized: final, fiche: mot-transparent, weight: 0.9}
lesson:
  - type: text
    fr: "Mots transparents fréquents, prononciation anglaise : IM-age /ˈɪmɪdʒ/, FO-cus /ˈfəʊkəs/, COL-league /ˈkɒliːɡ/, a-DULT ou A-dult, CHO-co-late, CLI-mate /ˈklaɪmət/, PRI-vate /ˈpraɪvət/, pur-POSE → PUR-pose /ˈpɜːpəs/, AR-ea /ˈeəriə/."
    en: "Frequent cognates, English pronunciation: IM-age /ˈɪmɪdʒ/, FO-cus /ˈfəʊkəs/, COL-league /ˈkɒliːɡ/, CHO-co-late, CLI-mate /ˈklaɪmət/, PRI-vate /ˈpraɪvət/, PUR-pose /ˈpɜːpəs/, AR-ea /ˈeəriə/."
  - type: listen
    fr: "Écoutez :"
    en: "Listen:"
    items: [image, focus, colleague, climate, purpose, area]
  - type: rule
    fr: "Paires pièges : DES-ert (désert) / des-SERT (dessert) ; a-DOPT / ADEPT ; « -ate » final des adjectifs et noms se réduit en /ət/ (PRI-vate, CLI-mate, CHO-co-late) mais pas dans les verbes (to se-PA-rate /eɪt/)."
    en: "Trap pairs: DES-ert / des-SERT (dessert); final '-ate' in adjectives and nouns reduces to /ət/ (PRI-vate, CLI-mate, CHO-co-late) but not in verbs (to SEP-a-rate /eɪt/)."
  - type: quiz
    q: {fr: "« focus » se prononce…", en: "'focus' is pronounced…"}
    options: ["/foˈkys/", "/ˈfəʊkəs/"]
    answer: 1
    explain: {fr: "FO-cus : accent à gauche, diphtongue /əʊ/, puis schwa.", en: "FO-cus: stress on the left, /əʊ/ diphthong, then schwa."}
