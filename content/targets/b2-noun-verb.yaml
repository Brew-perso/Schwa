id: b2-noun-verb
level: B2
order: 2
domain: prosodie
kind: stress
planet: {color: coral, motif: bands}
title: {fr: "Paires nom / verbe", en: "Noun / verb pairs"}
tagline: {fr: "a RE-cord · to re-CORD", en: "a RE-cord · to re-CORD"}
why:
  fr: "Une soixantaine de mots de deux syllabes changent d'accent selon leur nature : nom (ou adjectif) accentué sur la 1re syllabe, verbe sur la 2e. Se tromper change le mot — et souvent sa voyelle."
  en: "Around sixty two-syllable words change stress depending on their part of speech: the noun (or adjective) is stressed on the 1st syllable, the verb on the 2nd. Getting it wrong changes the word — and often its vowel."
criterion:
  fr: "Je distingue à l'oral « a PRE-sent » et « to pre-SENT », « an OB-ject » et « to ob-JECT »."
  en: "I distinguish 'a PRE-sent' and 'to pre-SENT', 'an OB-ject' and 'to ob-JECT' in speech."
phones: []
errors:
  - {target: stress, realized: other, fiche: nom-verbe, weight: 1.0}
lesson:
  - type: text
    fr: "NOM : accent à gauche. VERBE : accent à droite. a RE-cord / to re-CORD, a PRO-test / to pro-TEST, an IN-crease / to in-CREASE, a CON-duct / to con-DUCT."
    en: "NOUN: stress on the left. VERB: stress on the right. a RE-cord / to re-CORD, a PRO-test / to pro-TEST, an IN-crease / to in-CREASE, a CON-duct / to con-DUCT."
  - type: listen
    fr: "Nom, puis verbe :"
    en: "Noun, then verb:"
    items: ["a record", "to record", "a present", "to present"]
  - type: rule
    fr: "La voyelle suit l'accent : dans le verbe re-CORD, le « re » se réduit en /rɪ/ ; dans le nom RE-cord, c'est « -cord » qui se réduit : /ˈrekɔːd/ vs /rɪˈkɔːd/. Attention aux exceptions : « comment », « promise », « answer » gardent l'accent à gauche dans les deux cas."
    en: "The vowel follows the stress: in the verb re-CORD, 're' reduces to /rɪ/; in the noun RE-cord, '-cord' reduces: /ˈrekɔːd/ vs /rɪˈkɔːd/. Watch out for exceptions: 'comment', 'promise', 'answer' keep left stress in both cases."
  - type: quiz
    q: {fr: "« They want to protest. » Protest se dit…", en: "'They want to protest.' Protest is said…"}
    options: ["PRO-test", "pro-TEST"]
    answer: 1
    explain: {fr: "Verbe → accent à droite : pro-TEST.", en: "Verb → stress on the right: pro-TEST."}
