guided:
  - text: "The students protest against the protest ban."
    fr: "pro-TEST (verbe), PRO-test (nom)."
    en: "pro-TEST (verb), PRO-test (noun)."
  - text: "We export more than our main export."
    fr: "ex-PORT puis EX-port."
    en: "ex-PORT then EX-port."
transfer:
  - fr: "Décrivez un cadeau que vous avez offert ou reçu, et comment vous l'avez présenté (present, record, object, increase…)."
    en: "Describe a present you gave or received, and how you presented it (present, record, object, increase…)."
    hint_words: [present, record, object, increase]
fiches:
  nom-verbe:
    fr: "Ici, « {word} » est un {pos} : l'accent va sur « {stressed} ». Nom à gauche, verbe à droite."
    en: "Here, '{word}' is a {pos}: stress goes on '{stressed}'. Noun on the left, verb on the right."
