production:
  - {pair: [ship, sheep]}
  - {pair: [live, leave]}
  - {pair: [sit, seat]}
  - {pair: [fill, feel]}
  - {pair: [chip, cheap]}
  - {text: big}
  - {text: beach}
  - {text: city}
  - {text: "Please sit in this seat."}
  - {text: "I live in a big city."}
  - {text: "Keep it in the fridge."}
  - {text: "We leave at six."}
guided:
  - text: "Do you live here?"
    alt: "Do you leave here?"
    fr: "Habiter ou partir ? Le sens dépend de [votre|ta] voyelle."
    en: "Live or leave? The meaning depends on your vowel."
  - text: "Look at that ship!"
    alt: "Look at that sheep!"
    fr: "Un bateau ou un mouton ?"
    en: "A boat or an animal?"
  - text: "These chips are cheap."
    fr: "Les deux sons dans la même phrase : /iː/, /ɪ/, /iː/."
    en: "Both sounds in one sentence: /iː/, /ɪ/, /iː/."
transfer:
  - fr: "Où [habitez-vous|habites-tu] et [qu'aimez-vous|qu'aimes-tu] y faire ? [Employez|Emploie] « live », « city », « keep », « see », « visit »."
    en: "Where do you live and what do you like doing there? Use 'live', 'city', 'keep', 'see', 'visit'."
    hint_words: [live, city, keep, see, visit, beach]
fiches:
  i-tendu:
    fr: "On a entendu « {heard} » : [votre|ton] /ɪ/ était trop tendu, comme un « i » français. [Relâchez|Relâche] la langue et [ouvrez|ouvre] très légèrement la bouche, vers le « é »."
    en: "I heard '{heard}': your /ɪ/ was too tense, like a French 'i'. Relax your tongue and open your mouth very slightly, towards 'é'."
  i-relache:
    fr: "On a entendu « {heard} » : [étirez|étire] les lèvres comme pour sourire et [tendez|tends] la langue vers le haut pour /iː/."
    en: "I heard '{heard}': spread your lips as if smiling and push your tongue up for /iː/."
