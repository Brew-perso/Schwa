guided:
  - text: "Can you heat the soup?"
    alt: "Can you eat the soup?"
    fr: "Réchauffer ou manger ? Seul le /h/ le dit."
    en: "Warm it up or eat it? Only the /h/ tells."
  - text: "The hair is very dry."
    alt: "The air is very dry."
    fr: "Cheveux ou air ? [Faites-vous|Fais-toi] comprendre."
    en: "Hair or air? Make yourself understood."
  - text: "Can you hold it?"
    alt: "Is it old?"
    fr: "« hold » souffle, « old » s'enchaîne."
    en: "'hold' breathes, 'old' links."
transfer:
  - fr: "[Décrivez votre maison ou votre|Décris ta maison ou ton] appartement idéal (house, home, hall, high ceilings…) en quelques phrases."
    en: "Describe your ideal house or flat in a few sentences (house, home, hall, high ceilings…)."
    hint_words: [house, home, hall, high, huge, heating]
fiches:
  h-omis:
    fr: "On a entendu « {heard} » au lieu de « {word} ». [Soufflez|Souffle] comme pour faire de la buée sur une vitre, juste avant la voyelle : hhh-{word}."
    en: "I heard '{heard}' instead of '{word}'. Breathe out as if fogging a window, right before the vowel: hhh-{word}."
  h-intrus:
    fr: "Un /h/ s'est glissé devant « {word} ». Ce mot commence par une voyelle : [enchaînez-le|enchaîne-le] directement au mot précédent, sans souffle."
    en: "An /h/ slipped in before '{word}'. This word starts with a vowel: link it straight to the previous word, with no breath."
