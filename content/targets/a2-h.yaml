id: a2-h
level: A2
order: 4
domain: articuler
kind: segment
planet: {color: teal, motif: swirl}
title: {fr: "Le /h/ qui souffle", en: "The breathy /h/"}
tagline: {fr: "Heat ou eat ? Un souffle fait la différence", en: "Heat or eat? A breath makes the difference"}
why:
  fr: "Le français n'a pas de /h/ prononcé, alors on l'oublie (« I 'ate it ») ou, par excès de zèle, on l'ajoute là où il n'existe pas (« I hate my eggs » pour « eat »). Les deux changent le sens des mots et sont très remarqués."
  en: "French has no spoken /h/, so learners drop it ('I 'ate it') or, trying hard, add it where it doesn't belong ('I hate my eggs' for 'eat'). Both change meaning and are very noticeable."
criterion:
  fr: "Mon interlocuteur entend clairement « heat » ou « eat », « hair » ou « air » — selon ce que je veux dire."
  en: "My listener clearly hears 'heat' or 'eat', 'hair' or 'air' — whichever I mean."
phones: [h]
errors:
  - {target: h, realized: '∅', fiche: h-omis, weight: 0.8}
  - {target: '∅', realized: h, where: before-vowel, fiche: h-intrus, weight: 0.6}
lesson:
  - type: text
    fr: "Le /h/ anglais n'est qu'un souffle : de l'air qui sort, gorge ouverte, juste avant la voyelle. Aucun raclement (ce n'est pas la « jota » espagnole)."
    en: "The English /h/ is just a breath: air flowing out through an open throat, right before the vowel. No scraping (it isn't the Spanish 'jota')."
  - type: listen
    fr: "Écoutez les paires :"
    en: "Listen to the pairs:"
    items: [heat, eat, hair, air, hold, old]
  - type: gesture
    art: sagittal:h
    fr: "[Placez|Place] la main devant la bouche et [dites|dis] « heat » : [vous devez|tu dois] sentir l'air chaud, comme pour faire de la buée sur une vitre. Pour « eat », la main ne sent rien."
    en: "Put your hand in front of your mouth and say 'heat': you should feel warm air, like fogging up a window. For 'eat', your hand feels nothing."
  - type: rule
    fr: "Deux pièges : oublier le /h/ (hair → air), ou en ajouter un devant un mot qui commence par une voyelle (old → hold). Les mots-outils non accentués (he, his, her, have) perdent souvent leur /h/ chez les anglophones eux-mêmes : ce n'est pas une faute."
    en: "Two traps: dropping /h/ (hair → air), or adding one before a vowel-initial word (old → hold). Unstressed function words (he, his, her, have) often lose their /h/ even in native speech: that's fine."
  - type: quiz
    q: {fr: "Dans « an old house », combien de /h/ prononce-t-on ?", en: "In 'an old house', how many /h/ sounds do we pronounce?"}
    options: ["0", "1", "2"]
    answer: 1
    explain: {fr: "Un seul : house. « old » commence par une voyelle et s'enchaîne : an‿old.", en: "Just one: house. 'old' starts with a vowel and links: an‿old."}
