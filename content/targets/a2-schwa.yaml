id: a2-schwa
level: A2
order: 3
domain: prosodie
kind: reduction
planet: {color: indigo, motif: crescent}
title: {fr: "Le schwa /ə/", en: "Schwa /ə/"}
tagline: {fr: "La voyelle la plus fréquente de l'anglais — et la plus discrète", en: "English's most common vowel — and its quietest"}
why:
  fr: "Le schwa est la voyelle des syllabes faibles. Prononcer ces syllabes avec une voyelle « pleine » (ba-na-na à la française) efface le relief du mot : c'est ce qui gêne le plus l'oreille anglophone, plus qu'un accent mal placé."
  en: "Schwa is the vowel of weak syllables. Saying these syllables with a 'full' vowel (ba-na-na, French-style) flattens the word's shape: native ears find this more disruptive than misplaced stress."
criterion:
  fr: "Dans « banana », « about » ou « problem », mes syllabes faibles sont courtes et relâchées."
  en: "In 'banana', 'about' or 'problem', my weak syllables are short and relaxed."
phones: [ə]
errors:
  - {target: ə, realized: æ, fiche: voyelle-pleine, weight: 0.9}
  - {target: ə, realized: ɒ, fiche: voyelle-pleine, weight: 0.9}
  - {target: ə, realized: ɔː, fiche: voyelle-pleine, weight: 0.9}
  - {target: ə, realized: ɛ, fiche: voyelle-pleine, weight: 0.8}
  - {target: ə, realized: e, fiche: voyelle-pleine, weight: 0.8}
  - {target: ə, realized: o, fiche: voyelle-pleine, weight: 0.9}
  - {target: ə, realized: œ, fiche: voyelle-pleine, weight: 0.6}
lesson:
  - type: text
    fr: "Le schwa (/ə/, du mot hébreu « shva ») est un son neutre : bouche détendue, langue au repos, très court. C'est le « euh » d'hésitation… en beaucoup plus bref. Il peut s'écrire avec n'importe quelle lettre : a-bout, prob-lem, lem-on, sup-port."
    en: "Schwa (/ə/, from the Hebrew 'shva') is a neutral sound: relaxed mouth, tongue at rest, very short. It's the 'uh' of hesitation… only much briefer. Any letter can spell it: a-bout, prob-lem, lem-on, sup-port."
  - type: contrast
    fr: "Le rythme français donne à chaque syllabe la même durée. Le rythme anglais écrase les syllabes faibles entre les fortes."
    en: "French rhythm gives every syllable the same length. English rhythm squashes weak syllables between strong ones."
    french: "Tony finit quarante sorbets."
    english: "Tony finished forty ice creams."
  - type: listen
    fr: "Repérez le petit /ə/ dans chaque mot :"
    en: "Spot the tiny /ə/ in each word:"
    items: [banana, about, problem, London]
  - type: gesture
    art: sagittal:schwa
    fr: "[Relâchez|Relâche] tout : mâchoire entrouverte, lèvres neutres, langue posée. Le schwa ne demande aucun effort — c'est justement le but."
    en: "Relax everything: jaw slightly open, lips neutral, tongue resting. Schwa takes no effort — that's the whole point."
  - type: quiz
    q: {fr: "Dans « banana », combien de voyelles sont réduites en /ə/ ?", en: "In 'banana', how many vowels are reduced to /ə/?"}
    options: ["0", "1", "2", "3"]
    answer: 2
    explain: {fr: "b/ə/-NA-n/ə/ : seule la syllabe forte garde sa voyelle pleine.", en: "b/ə/-NA-n/ə/: only the strong syllable keeps its full vowel."}
