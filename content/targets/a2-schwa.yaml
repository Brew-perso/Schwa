guided:
  - text: "It's quiet, isn't it? — Quite."
    fr: "« quiet » a deux syllabes (QUI-/ə/t), « quite » une seule. Le schwa fait la différence."
    en: "'quiet' has two syllables (QUI-/ə/t), 'quite' only one. Schwa makes the difference."
  - text: "Canada is famous for its lakes."
    fr: "CA-n/ə/-d/ə/, FA-m/ə/s."
    en: "CA-n/ə/-d/ə/, FA-m/ə/s."
  - text: "Tony finished forty ice creams."
    fr: "Quatre syllabes fortes, et des syllabes faibles écrasées entre elles : TO-ny FI-nished FOR-ty ICE-creams."
    en: "Four strong syllables, with weak ones squashed between them: TO-ny FI-nished FOR-ty ICE-creams."
transfer:
  - fr: "Qu'avez-vous mangé aujourd'hui ? Répondez en quelques phrases (banana, potato, tomato, lemon…)."
    en: "What have you eaten today? Answer in a few sentences (banana, potato, tomato, lemon…)."
    hint_words: [banana, potato, tomato, lemon, chocolate]
fiches:
  voyelle-pleine:
    fr: "La syllabe faible de « {word} » sonnait comme une voyelle pleine (« {heard} »). [Relâchez|Relâche] la bouche et [raccourcissez|raccourcis] : un simple /ə/, presque avalé."
    en: "The weak syllable in '{word}' sounded like a full vowel ('{heard}'). Relax your mouth and shorten it: just a quick /ə/, almost swallowed."
